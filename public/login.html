<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - TatuAppte</title>
  <meta name="description" content="Inicia sesión en TatuAppte, la plataforma de agendamiento y cotizador 3D para estudios de tatuajes." />
  <link rel="stylesheet" href="/css/tatuappte.css" />
</head>
<body class="bg-grid-pattern">

  <main class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Tarjeta Bonitapp -->
      <div class="bonitapp-card">
        
        <!-- Cabecera de Marca -->
        <header class="brand-header">
          <div class="brand-badge">
            <!-- Icono de aguja/tatuaje minimalista -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 19 7-7 3 3-7 7-3-3z"/>
              <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18"/>
              <path d="m2 2 7.586 7.586"/>
              <circle cx="11" cy="11" r="2"/>
            </svg>
            <span>TatuAppte Studio</span>
          </div>
          <h1 class="brand-title">Bienvenido de nuevo</h1>
          <p class="brand-subtitle">Ingresa a tu cuenta para gestionar tu agenda o cotizar en el probador 3D.</p>
        </header>

        <!-- Mensaje de Alerta dinámico -->
        <div id="alertBox" class="alert-box">
          <span id="alertIcon"></span>
          <span id="alertMessage"></span>
        </div>

        <!-- Formulario de Login -->
        <form id="loginForm" autocomplete="on">
          
          <!-- Campo Email -->
          <div class="form-group">
            <label for="email" class="form-label">Correo electrónico</label>
            <div class="input-container">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="bonitapp-input" 
                placeholder="tu@correo.com" 
                required 
                autocomplete="email"
              />
            </div>
          </div>

          <!-- Campo Contraseña -->
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <label for="password" class="form-label" style="margin-bottom: 0;">Contraseña</label>
              <a href="#" class="auth-link" style="font-size: 12px; font-weight: 500; color: var(--text-secondary);" onclick="alert('Funcionalidad de recuperación vía correo disponible próximamente con Supabase Auth.')">¿Olvidaste tu clave?</a>
            </div>
            <div class="input-container">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="bonitapp-input" 
                placeholder="••••••••" 
                required 
                autocomplete="current-password"
              />
              <button type="button" class="toggle-password" id="togglePasswordBtn" title="Mostrar u ocultar contraseña">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Botón Principal -->
          <button type="submit" id="submitBtn" class="btn-primary">
            <span id="btnText">Ingresar al Estudio</span>
            <span id="btnSpinner" class="spinner" style="display: none;"></span>
          </button>
        </form>

        <!-- Pie de tarjeta -->
        <footer class="auth-footer">
          ¿No tienes una cuenta? 
          <a href="/register" class="auth-link">Regístrate gratis</a>
        </footer>

      </div>

      <!-- Pie de página informativo -->
      <div class="app-meta-footer">
        TatuAppte &copy; 2026 &bull; Agendamiento y Cotizador 3D para Estudios
      </div>

    </div>
  </main>

  <script>
    // Toggle visibilidad de contraseña
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword
        ? `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>`
        : `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`;
    });

    // Manejo de Alertas
    const alertBox = document.getElementById('alertBox');
    const alertMessage = document.getElementById('alertMessage');
    const alertIcon = document.getElementById('alertIcon');

    function showAlert(msg, type = 'error') {
      alertBox.className = `alert-box alert-${type}`;
      alertMessage.textContent = msg;
      alertIcon.innerHTML = type === 'error'
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
      alertBox.style.display = 'flex';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    // Manejo de envío de Login
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnSpinner.style.display = isLoading ? 'inline-block' : 'none';
      btnText.textContent = isLoading ? 'Verificando...' : 'Ingresar al Estudio';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('Por favor completa todos los campos.');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showAlert(data.error || 'Error al iniciar sesión.');
          setLoading(false);
          return;
        }

        // Guardar sesión en localStorage
        localStorage.setItem('tatuappte_user', JSON.stringify(data.user));
        showAlert('¡Bienvenido! Redirigiendo...', 'success');

        setTimeout(() => {
          // Si es cliente o tatuador, dirigir a la vista correspondiente o al probador 3D
          window.location.href = '/probador';
        }, 800);

      } catch (err) {
        console.error(err);
        showAlert('No se pudo conectar con el servidor. Revisa tu conexión.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
